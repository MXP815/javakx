<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- 玉米棒主体 - 金黄色 -->
  <defs>
    <linearGradient id="cornGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFC107;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB300;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8BC34A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafDarkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#689F38;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8BC34A;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- 底部绿叶（左边） -->
  <path d="M35,95 Q15,110 10,140 Q20,125 40,110 Q45,100 50,95 Z" fill="url(#leafGradient)" filter="url(#shadow)"/>
  <!-- 底部绿叶（右边） -->
  <path d="M85,95 Q105,110 110,140 Q100,125 80,110 Q75,100 70,95 Z" fill="url(#leafGradient)" filter="url(#shadow)"/>
  
  <!-- 玉米棒（椭圆形状） -->
  <ellipse cx="60" cy="55" rx="28" ry="45" fill="url(#cornGradient)" filter="url(#shadow)"/>
  
  <!-- 玉米粒纹理 - 横向排列 -->
  <g fill="#FFE082" opacity="0.7">
    <!-- 第1排 -->
    <ellipse cx="42" cy="20" rx="4" ry="5"/>
    <ellipse cx="52" cy="18" rx="4" ry="5"/>
    <ellipse cx="62" cy="18" rx="4" ry="5"/>
    <ellipse cx="72" cy="20" rx="4" ry="5"/>
    <!-- 第2排 -->
    <ellipse cx="38" cy="30" rx="4" ry="5"/>
    <ellipse cx="46" cy="28" rx="4" ry="5"/>
    <ellipse cx="56" cy="27" rx="4" ry="5"/>
    <ellipse cx="66" cy="28" rx="4" ry="5"/>
    <ellipse cx="76" cy="30" rx="4" ry="5"/>
    <!-- 第3排 -->
    <ellipse cx="36" cy="40" rx="4" ry="5"/>
    <ellipse cx="44" cy="38" rx="4" ry="5"/>
    <ellipse cx="54" cy="37" rx="4" ry="5"/>
    <ellipse cx="64" cy="38" rx="4" ry="5"/>
    <ellipse cx="74" cy="40" rx="4" ry="5"/>
    <!-- 第4排 -->
    <ellipse cx="35" cy="50" rx="4" ry="5"/>
    <ellipse cx="43" cy="48" rx="4" ry="5"/>
    <ellipse cx="53" cy="47" rx="4" ry="5"/>
    <ellipse cx="63" cy="48" rx="4" ry="5"/>
    <ellipse cx="73" cy="50" rx="4" ry="5"/>
    <!-- 第5排 -->
    <ellipse cx="35" cy="60" rx="4" ry="5"/>
    <ellipse cx="43" cy="58" rx="4" ry="5"/>
    <ellipse cx="53" cy="57" rx="4" ry="5"/>
    <ellipse cx="63" cy="58" rx="4" ry="5"/>
    <ellipse cx="73" cy="60" rx="4" ry="5"/>
    <!-- 第6排 -->
    <ellipse cx="36" cy="70" rx="4" ry="5"/>
    <ellipse cx="44" cy="68" rx="4" ry="5"/>
    <ellipse cx="54" cy="67" rx="4" ry="5"/>
    <ellipse cx="64" cy="68" rx="4" ry="5"/>
    <ellipse cx="74" cy="70" rx="4" ry="5"/>
    <!-- 第7排 -->
    <ellipse cx="38" cy="80" rx="4" ry="5"/>
    <ellipse cx="46" cy="78" rx="4" ry="5"/>
    <ellipse cx="56" cy="77" rx="4" ry="5"/>
    <ellipse cx="66" cy="78" rx="4" ry="5"/>
    <ellipse cx="76" cy="80" rx="4" ry="5"/>
    <!-- 第8排 -->
    <ellipse cx="42" cy="88" rx="4" ry="5"/>
    <ellipse cx="52" cy="87" rx="4" ry="5"/>
    <ellipse cx="62" cy="87" rx="4" ry="5"/>
    <ellipse cx="72" cy="88" rx="4" ry="5"/>
  </g>
  
  <!-- 玉米顶部的须 -->
  <g stroke="#8D6E63" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M50,12 Q48,5 45,2"/>
    <path d="M55,10 Q55,3 55,0"/>
    <path d="M60,10 Q62,4 65,1"/>
    <path d="M65,11 Q70,5 75,3"/>
    <path d="M58,12 Q57,4 53,1"/>
    <path d="M62,11 Q67,6 72,4"/>
  </g>
  
  <!-- 顶部叶子（包裹玉米顶部） -->
  <path d="M35,25 Q28,15 32,5 Q40,15 42,25 Z" fill="url(#leafDarkGradient)"/>
  <path d="M85,25 Q92,15 88,5 Q80,15 78,25 Z" fill="url(#leafDarkGradient)"/>
  
  <!-- 中间叶脉 -->
  <path d="M60,20 L60,95" stroke="#FF8F00" stroke-width="1" opacity="0.3"/>
</svg>

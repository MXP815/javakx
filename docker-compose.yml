version: '2'
services:
  xnc-wms-mysql:
    build:
      context: ./db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_ROOT_HOST: '%'
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      TZ: Asia/Shanghai
    restart: always
    container_name: xnc-wms-mysql
    image: xnc-wms-mysql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --max_allowed_packet=128M
      --default-authentication-plugin=caching_sha2_password
    ports:
      - 3306:3306
    networks:
      - xnc-wms

  xnc-wms-redis:
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/redis:5.0
    ports:
      - 6379:6379
    restart: always
    hostname: xnc-wms-redis
    container_name: xnc-wms-redis
    networks:
      - xnc-wms

  xnc-wms-system:
    build:
      context: ./jeecg-module-system/jeecg-system-start
    restart: on-failure
    depends_on:
      - xnc-wms-mysql
      - xnc-wms-redis
    container_name: xnc-wms-system
    image: xnc-wms-system
    hostname: xnc-wms-system
    ports:
      - 8089:8089
    networks:
      - xnc-wms

networks:
  xnc-wms:
    name: xnc_wms
